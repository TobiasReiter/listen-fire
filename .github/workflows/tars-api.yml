# Skaala's TARS API image: deploy/tars-api/Dockerfile (the release + patches),
# pushed to this fork's registry for Render's listen-fire-api service.
name: tars-api image
on:
  push:
    branches: [skaala/deploy]
    paths: [deploy/tars-api/**, .github/workflows/tars-api.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/tars-api
          push: true
          tags: ghcr.io/tobiasreiter/tars-api:v0.11.0-skaala.1
