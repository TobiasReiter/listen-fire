name: movement-wasm
# A prod-safety check, not a lint gate: the repo ships two artifacts so the
# pnpm dev loop needs no Rust, and the shipped bytes must be the crates':
# movement.wasm (the parser and the engine, built from crates/movement-engine;
# the API's) and movement_parser.wasm (crates/movement-parser alone; the
# browser's).
#
#  - rebuild-matches-committed rebuilds both artifacts and fails if either
#    differs.
#  - parser-tests runs both crates' tests (including the strict programs
#    harness) and the movement-lang parser pins through the committed
#    artifact: every corpus program and expression text parses as pinned;
#    and the catalog differential: the Rust catalog answers every lookup the
#    checker corpus makes as the TypeScript one does; and the engine's
#    TypeScript shim, against a double and through the committed artifact;
#    the Rust engine's oracle regenerated from the TypeScript and diffed;
#    and both conformance corpora run with MOVEMENT_ENGINE=rust.
#
# The committed artifact was built on macOS; the path remapping and pinned
# toolchain in scripts/build-movement-wasm.sh are meant to make Linux produce the
# same bytes, and this workflow's first green run is what verifies that.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-movement-wasm.sh"
      - "packages/movement-lang/**"
      - "packages/shared/expression/**"
      - "packages/shared/timezone/**"
      - "packages/shared/cron/**"
      # The TypeScript side of the oracle: the engine and its shim, the
      # corpora, and what runs them.
      - "apps/api/src/services/movement_engine/**"
      - "apps/api/src/__conformance__/**"
      - "apps/api/src/test/rust_eval_stats*"
      - "apps/api/src/test/__test__/rust_eval_stats*"
      - "apps/api/src/test/jest-conformance-v*.config.ts"
      - ".github/workflows/movement-wasm.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-movement-wasm.sh"
      - "packages/movement-lang/**"
      - "packages/shared/expression/**"
      - "packages/shared/timezone/**"
      - "packages/shared/cron/**"
      # The TypeScript side of the oracle: the engine and its shim, the
      # corpora, and what runs them.
      - "apps/api/src/services/movement_engine/**"
      - "apps/api/src/__conformance__/**"
      - "apps/api/src/test/rust_eval_stats*"
      - "apps/api/src/test/__test__/rust_eval_stats*"
      - "apps/api/src/test/jest-conformance-v*.config.ts"
      - ".github/workflows/movement-wasm.yml"

permissions:
  contents: read

jobs:
  rebuild-matches-committed:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned compiler and
      # the wasm target on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      # Registry downloads only: caching target/ would let stale intermediate
      # output into the build whose bytes are being compared.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Rebuild and compare
        run: |
          artifacts="packages/movement-lang/wasm/movement.wasm packages/movement-lang/wasm/movement_parser.wasm"
          committed=$(sha256sum $artifacts)
          ./scripts/build-movement-wasm.sh
          rebuilt=$(sha256sum $artifacts)
          echo "committed:"; echo "$committed"
          echo "rebuilt:"; echo "$rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::a movement artifact differs from what the crates build. Run scripts/build-movement-wasm.sh and commit both rebuilt files in packages/movement-lang/wasm/. If it differs only on Linux, the build is not reproducible across platforms: see the reproducibility notes in crates/movement-parser/README.md."
            exit 1
          fi

  parser-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # Registry downloads only, as above: a target/ cache keyed on the lock
      # file would outlive the sources it was built from.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Crate tests
        run: cargo test --locked -p movement-parser -p movement-engine
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "pnpm"
      # Full workspace install, as in api-test.yml: movement-lang's tests
      # resolve workspace packages through symlinks a filtered install omits.
      - run: pnpm install --frozen-lockfile
      - name: Parser pins through the committed artifact
        working-directory: packages/movement-lang
        run: pnpm run test --testPathPattern 'programs_regression|trees_regression|rust_entry_points|lowering_regression|lowering_vocabulary|checks_regression|catalog_depth|loader|env_services'
      # The TypeScript catalog stays in use until the checker is ported, so
      # the Rust one is held to it on every change to either.
      - name: Catalog differential through the committed artifact
        working-directory: packages/movement-lang
        env:
          MOVEMENT_CATALOG_DIFFERENTIAL: "1"
        run: pnpm run test --testPathPattern 'catalog_differential'
      - name: Engine shim, against a double and through the committed artifact
        working-directory: apps/api
        run: pnpm run test:unit --testPathPattern '(movement_engine/__test__/(rust_engine|rust_engine_abi|rust_eval|rust_run|rust_write|program_check|seam_guard)|test/__test__/rust_eval_stats_teardown)\.unit\.test\.ts$'
      # The oracle the crate tests hold the Rust engine to is the TypeScript's
      # own answers: a TypeScript change that moves one must move the oracle.
      - name: The Rust engine's oracle is current
        working-directory: apps/api
        run: |
          TS_NODE_PROJECT=tsconfig.json npx ts-node --transpile-only ../../crates/movement-engine/tests/oracle/generate.ts
          git diff --exit-code -- ../../crates/movement-engine/tests/oracle || {
            echo "::error::crates/movement-engine/tests/oracle is stale: regenerate it (see generate.ts) and commit it, then make the crate tests pass."
            exit 1
          }
      # The environment services' fixture is Node's own answers: the same
      # Node regenerates the same bytes (env_services.unit.test.ts above
      # already fails on a Node whose answers moved).
      - name: The environment services' fixture is current
        working-directory: apps/api
        run: |
          TS_NODE_PROJECT=tsconfig.json npx ts-node --transpile-only ../../crates/movement-engine/tests/env/generate.ts
          git diff --exit-code -- ../../crates/movement-engine/tests/env || {
            echo "::error::crates/movement-engine/tests/env is stale: regenerate it (see generate.ts) and commit it, then make the crate tests pass."
            exit 1
          }
      # The corpora's suites import the generated Prisma client's types.
      - run: pnpm prisma generate
      # Everything the allow-list admits runs in Rust; the teardown fails a
      # run in which Rust answered nothing.
      - name: Conformance corpora through the Rust evaluator
        working-directory: apps/api
        env:
          MOVEMENT_ENGINE: rust
        run: |
          pnpm run test:conformance:v1
          pnpm run test:conformance:v2
      # Each artifact's download size in view: the parser's ships to every
      # browser, the engine's to the API only.
      - name: Size budgets
        run: |
          budget() {
            f="packages/movement-lang/wasm/$1"
            raw=$(wc -c < "$f" | tr -d ' ')
            gz=$(gzip -9 -c "$f" | wc -c | tr -d ' ')
            echo "$1: raw $raw bytes, gzipped $gz bytes"
            if [ "$gz" -gt "$3" ]; then
              echo "::error::$1 is $gz bytes gzipped, over its $3-byte budget."
              exit 1
            fi
            if [ "$gz" -gt "$2" ]; then
              echo "::warning::$1 is $gz bytes gzipped, over its $2-byte warning line (fails at $3)."
            fi
          }
          budget movement_parser.wasm 409600 614400
          budget movement.wasm 614400 1048576
