name: api-test
on:
  push:
    paths:
      - "apps/api/**"
      # The contract docs and the code they transcribe, held equal by the
      # contracts' drift guards (the step below).
      - "docs/contracts/**"
      - "packages/engine-contracts/**"
      - "packages/shared/**"
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRESQL_FSYNC: "off"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "pnpm"
      # Full workspace install — apps/api typechecks against workspace packages
      # (@listen-fire/shared, movement-lang) that are consumed as raw TS source via
      # symlinks. A filtered install omits those symlinks → TS2307. (Was
      # `--filter api --filter prisma-generator-casl`.)
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Cache tsbuildinfo
        uses: actions/cache@v4
        with:
          path: apps/api/.tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Typecheck
        env:
          # apps/api's typecheck OOMs (exit 134) below an 8GB heap — same
          # requirement as the local dev loop. Standard runners have 16GB.
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm code:type-check
      # Bounded smoke set over the vulnerable paths (engine arbiter, webhook
      # signatures, ask escalation, file-blob route, dispatch routing, movement
      # execute/run-now, poll worker). Unit-only, ~1 min, can't OOM/timeout —
      # this is the regression signal, not the full suite (that's `pnpm health`).
      # The contract docs' drift guards: each doc's version line, shape blocks
      # and the index table against packages/engine-contracts. Seconds, no DB.
      - name: Contract docs drift guards
        run: pnpm --filter engine-contracts test
      - name: Shared package tests
        run: pnpm --filter @listen-fire/shared test
      - name: Smoke tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # The smoke suite imports modules that read env at load (prisma, the
          # inbound/outbound adapters); inert defaults live in
          # src/test/test-env-defaults.ts. DATABASE_URL_TEST is bound here to the
          # ephemeral postgres service above (never a real DB) — prisma connects
          # on import; the tests mock all queries, so no migration is needed.
          DATABASE_URL_TEST: postgresql://test:test@localhost:5432/test
          DATABASE_URL_TEST_READONLY: postgresql://test:test@localhost:5432/test
        run: pnpm test:smoke
      # Lint (eslint) and unused-exports (knip) are NOT CI gates: they're code
      # hygiene that doesn't break prod, and lint is resource-heavy. Run them
      # locally instead (`pnpm verify:local`). CI only gates what would break
      # prod: types, behaviour (smoke), and DB schema/triggers.
      - name: Generated Prisma client is committed
        # The authorized Prisma (CASL) client is generated from
        # schema.autogenerated.prisma — a stale committed client would mismatch
        # the schema at runtime. Replaces the old `migrate:diff` drift check,
        # which validated the now-retired hand-maintained schema.prisma (a stale
        # vestige; the real schema is schema-first via schema.sql). `prisma
        # generate` reads the schema only — no DB needed.
        run: |
          pnpm prisma generate > /dev/null
          git diff --exit-code -- src/generated
      - name: Missing audit log triggers
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        # Build the test DB from schema.sql (the schema-first source of truth).
        # schema.sql is the prod-shaped schema, including the audit triggers
        # this step checks.
        run: |
          # schema.sql GRANTs to the `agent` role (exists in dev/prod, not in a
          # bare CI postgres) — create it so the dump applies cleanly.
          psql "$DATABASE_URL" -c "CREATE ROLE agent" 2>/dev/null || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f src/db/migrations/init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f src/db/schema.sql > /dev/null
          ./scripts/check_database_triggers.sh
