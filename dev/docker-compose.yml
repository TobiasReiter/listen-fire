version: "3.6"
# Container names are parameterized on $LISTEN_FIRE_STACK so two checkouts on
# the same machine (a fork, a second clone) never collide on the same
# Postgres/Redis/MinIO containers. dev/loop.sh exports it, and also passes it as
# `docker compose -p`, before every `docker compose` call — defaulting to
# `listenfire-<repo dir basename>` (the compose project name itself must come
# from `-p` on the command line rather than a top-level `name:` field here:
# older Docker Compose does not interpolate `${VAR}` in that field, so it
# would render literally instead of varying per checkout). Set
# $LISTEN_FIRE_STACK yourself if you drive this file directly. Host ports
# come from $POSTGRES_HOST_PORT / $REDIS_HOST_PORT / $MINIO_HOST_PORT (defaulting to 9432/6379,
# the developer stack's fixed ports) so a profile that wants its own isolated
# datastore — the `agent` profile, see dev/loop.sh — can claim different ones
# instead of fighting the developer's stack, or an unrelated compose project
# on the same host, for the default ports.
services:
  postgres:
    container_name: ${LISTEN_FIRE_STACK}-postgres
    build:
      context: ..
      dockerfile: dev/Dockerfile
    volumes:
      - listenfire-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: listenfire
    ports:
      - "${POSTGRES_HOST_PORT:-9432}:5432"

  redis:
    container_name: ${LISTEN_FIRE_STACK}-redis
    image: redis:7.2-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning

  # Local S3-compatible file store (the same image the production composition
  # bundles). S3 API on $MINIO_HOST_PORT (default 9010), web console on
  # $MINIO_CONSOLE_HOST_PORT (default 9011) — deliberately not 9000/9001.
  minio:
    container_name: ${LISTEN_FIRE_STACK}-minio
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    # MinIO creates no bucket on its own, and on its single-drive backend a
    # directory in the data root IS a bucket (same trick as deploy/'s minio) —
    # so creating the dev bucket is an idempotent mkdir before the server starts.
    entrypoint: ['sh', '-c', 'mkdir -p /data/listenfire-dev && exec minio server /data --console-address :9001']
    environment:
      MINIO_ROOT_USER: listenfire
      MINIO_ROOT_PASSWORD: localdevpassword
    volumes:
      - listenfire-minio:/data
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  listenfire-postgres:
  listenfire-minio:
  redis:
    driver: local
