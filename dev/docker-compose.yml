version: "3.6"
# Container names are parameterized on $LISTEN_FIRE_STACK so two checkouts on
# the same machine (a fork, a second clone) never collide on the same
# Postgres/Redis/object-store containers. dev/loop.sh exports it, and also passes it as
# `docker compose -p`, before every `docker compose` call — defaulting to
# `listenfire-<repo dir basename>` (the compose project name itself must come
# from `-p` on the command line rather than a top-level `name:` field here:
# older Docker Compose does not interpolate `${VAR}` in that field, so it
# would render literally instead of varying per checkout). Set
# $LISTEN_FIRE_STACK yourself if you drive this file directly. Host ports
# come from $POSTGRES_HOST_PORT / $REDIS_HOST_PORT / $S3_HOST_PORT (defaulting to 9432/6379/9010,
# the developer stack's fixed ports) so a profile that wants its own isolated
# datastore — the `agent` profile, see dev/loop.sh — can claim different ones
# instead of fighting the developer's stack, or an unrelated compose project
# on the same host, for the default ports.
services:
  postgres:
    container_name: ${LISTEN_FIRE_STACK}-postgres
    build:
      context: ..
      dockerfile: dev/Dockerfile
    volumes:
      - listenfire-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: listenfire
    ports:
      - "${POSTGRES_HOST_PORT:-9432}:5432"

  redis:
    container_name: ${LISTEN_FIRE_STACK}-redis
    image: redis:7.2-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning

  # Local S3-compatible file store: SeaweedFS (the same image the self-host
  # composition bundles), its all-in-one `weed mini` mode. S3 API on
  # $S3_HOST_PORT (default 9010) — deliberately not 9000. Static credentials are
  # the AWS_* env `weed mini` reads; `-bucket` creates the dev bucket at start
  # when it is missing (idempotent). `-ip=127.0.0.1` keeps the components
  # talking over loopback, so a recreated container on a new network address
  # still finds its own data; `-ip.bind` keeps the S3 port reachable. WebDAV,
  # the admin UI and the Iceberg/Lance catalog ports are off — only S3 is used.
  objectstore:
    container_name: ${LISTEN_FIRE_STACK}-objectstore
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=listenfire-dev
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: listenfire
      AWS_SECRET_ACCESS_KEY: localdevpassword
    volumes:
      - listenfire-objectstore:/data
    ports:
      - "${S3_HOST_PORT:-9010}:8333"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  listenfire-postgres:
  listenfire-objectstore:
  redis:
    driver: local
