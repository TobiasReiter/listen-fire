# A local trial: Postgres, one `serve` (the doors) and a `drain` loop (the worker).
#   docker compose -f deploy/lf/docker-compose.yml up --build
# Build context is the repository root. Mount your own project over
# /srv/lf/project to run your movements instead of the empty default.
x-lf: &lf
  build: { context: ../.., dockerfile: deploy/lf/Dockerfile }
  environment:
    # sslmode=disable only because this local Postgres has no TLS; a real
    # database URL ends ?sslmode=verify-full.
    LF_SECRET__POSTGRES_STORE__EXTERNAL: "@lf/postgres-store"
    LF_SECRET__POSTGRES_STORE__URL: postgres://lf:lf@postgres:5432/lf?sslmode=disable
  depends_on:
    postgres: { condition: service_healthy }
    setup: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: lf, POSTGRES_PASSWORD: lf, POSTGRES_DB: lf }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lf"], interval: 2s, retries: 30 }
  # The store's setup: creates and migrates its `lf` schema, then exits.
  setup:
    <<: *lf
    depends_on:
      postgres: { condition: service_healthy }
    command: ["lf-host", "connect", "@lf/postgres-store"]
  serve:
    <<: *lf
    ports: ["8080:8080"]
  drain:
    <<: *lf
    # What a scheduler does on a platform: short drains, started again and again.
    command: ["sh", "-c", "while true; do lf-host drain --until-idle --max-seconds 55; sleep 5; done"]
