# Listen-Fire, self-hosted. One file, every shape.
#
# WHICH units run is `LISTEN_FIRE_PRODUCTS`, at run time — the same variable the
# process itself reads (apps/api/src/products.ts). `deploy/up.sh` sets it,
# derives the identity provider and the delivery modes from it, and waits for
# health.
#
# Bare `docker compose up` is the whole of Listen-Fire — every unit, with core
# identity. WHICH optional pieces come with it is `COMPOSE_PROFILES` in `.env`,
# not a flag: `postgres`, `redis` and `minio` are the bundled datastores and are
# on in the shipped line; `admin` adds the platform-admin UI and `demo` the fake
# third parties plus the sample dataset. Keep the list there rather than passing
# `--profile`, which REPLACES it rather than adding to it on older compose
# versions — that is how a `down` ends up leaving containers behind. `up.sh`
# names its profiles on the command line and passes no list, which is the same
# rule from the other side.
#
# Secrets are NOT in this file and not in `.env`. The one-shot `init` service
# mints them into the `listen-fire-config` volume on first boot and never again; every
# service mounts that volume at /config and sources it through
# `with-generated-env`. Postgres reads its password from /config/postgres_password
# because a named volume is invisible to `env_file` (the docker CLI reads that on
# the host).
#
# ── THE THREE DATASTORES ────────────────────────────────────────────────────
#
# Postgres, Redis and the object store each come bundled here and each can be
# moved to a managed service on its own, by naming that service in `.env` and
# nothing else:
#
#   DATABASE_URL                    set → the bundled `postgres` is not started
#   MESSAGE_QUEUE_REDIS_HOSTNAME    set → the bundled `redis` is not started
#   AWS_S3_ENDPOINT                 set → the bundled `minio` is not started
#
# The mechanism is the `profiles:` line on each of those three services. A
# bundled store sits in the profile named after it (`postgres`, `redis`,
# `minio`), which `deploy/.env`'s COMPOSE_PROFILES enables and `up.sh` names on
# the command line. Setting the variable rewrites that profile name to
# `unused-postgres` / `unused-redis` / `unused-minio`, which nothing enables, so
# the service leaves the composition entirely — it is not started, not built,
# not `docker compose config`'d. Nothing here needs editing to move a store off
# the box, which is the whole point: see SELF_HOSTING.md, "Bringing your own
# datastores".
#
# Two consequences of a service that may not exist, both deliberate:
#   - NOTHING `depends_on` those three. A `depends_on` naming a service that is
#     not in the composition is a hard error on every compose version this file
#     supports, so `migrate` waits for the database ITSELF (below), which is the
#     same wait whether the database is next door or across a VPC.
#   - The api no longer waits on Redis. It reaches for it lazily, and the
#     bundled Redis answers long before the migration step finishes.

name: listen-fire

x-node-app: &node-app
  env_file:
    - .env
  volumes:
    - listen-fire-config:/config
  entrypoint: ['/usr/local/bin/with-generated-env']

# Published images by default; `build:` stays so `docker compose build` and
# `up.sh --build` still produce exactly these tags from this tree. Which
# RELEASE an installation runs is `LISTEN_FIRE_VERSION` — pin it in .env and
# the installation moves only when you change it. Unpinned means `latest`,
# which moves under you the next time anything pulls.
x-api-image: &api-image
  image: ghcr.io/listen-fire/api:${LISTEN_FIRE_VERSION:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      # A source build of an untagged tree is `dev`, and says so on
      # /healthz/workers and in the settings page.
      LISTEN_FIRE_VERSION: ${LISTEN_FIRE_VERSION:-dev}

services:
  # First boot only. Refuses when deploy/.env names no model key and LISTEN_FIRE_DEMO
  # is not 1; rewrites nothing once generated.env exists.
  init:
    image: node:22.23.4-slim
    env_file:
      - .env
    environment:
      LISTEN_FIRE_DEMO: ${LISTEN_FIRE_DEMO:-0}
      LISTEN_FIRE_TEAM_NAME: ${LISTEN_FIRE_TEAM_NAME:-Acme}
      LISTEN_FIRE_ADMIN_EMAIL: ${LISTEN_FIRE_ADMIN_EMAIL:-admin@listen-fire.local}
    volumes:
      - listen-fire-config:/config
      - ./init:/init:ro
    command: ['sh', '/init/generate-env.sh']
    restart: 'no'

  # pgvector because the migration set is monolithic: all six extensions it
  # creates — `vector`, `pg_trgm`, `citext`, `pgcrypto`, `unaccent`, `btree_gin`
  # — get created whatever units run.
  #
  # Parked by naming your own database in DATABASE_URL — see the header.
  postgres:
    profiles: ['${DATABASE_URL:+unused-}postgres']
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_DB: listenfire
      POSTGRES_PASSWORD_FILE: /config/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `agent` and `readonly` roles the migration set grants to, on
      # an empty data directory. A MANAGED database has no such hook.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - listen-fire-config:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U listenfire -d listenfire']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Core's MCP OAuth flow keeps in-flight state here; automations' runaway-loop
  # guard keeps its counters here. Every shipped composition runs it — a bare
  # `docker compose up` mounts every unit, and two of them write here — so its
  # profile is on by default and the only thing that parks it is naming your own
  # Redis in MESSAGE_QUEUE_REDIS_HOSTNAME. A shape that needs none of it pays
  # for one idle alpine container.
  redis:
    profiles: ['${MESSAGE_QUEUE_REDIS_HOSTNAME:+unused-}redis']
    image: redis:7.2-alpine
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The bundled object store. Anything that handles a file — an inbound email
  # attachment, WhatsApp media, a generated document, a valuations attachment —
  # wants an S3-compatible bucket, and there is no local-filesystem driver, so
  # this is that bucket for an installation that has not moved storage to a
  # managed one. `with-generated-env` points the api at it whenever the operator
  # has supplied no key of their own.
  #
  # Not published to the host, deliberately. The api reaches it over the compose
  # network, and a presigned link handed to a BROWSER or a third party resolves
  # only where the hostname `minio` does — so a deployment that hands out file
  # links points AWS_S3_ENDPOINT at an object store on a public origin, which is
  # also what parks this service.
  minio:
    profiles: ['${AWS_S3_ENDPOINT:+unused-}minio']
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: listenfire
      # Same reason postgres takes POSTGRES_PASSWORD_FILE: the password is in a
      # named volume, which `env_file` cannot read.
      MINIO_ROOT_PASSWORD_FILE: /config/minio_password
      MINIO_BROWSER: 'off'
    # MinIO creates no bucket on its own, and on its single-drive backend a
    # directory in the data root IS a bucket.
    entrypoint: ['sh', '-c', 'mkdir -p /data/listen-fire && exec minio server /data --address :9000']
    volumes:
      - miniodata:/data
      - listen-fire-config:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot, to completion, before the API starts — so a restart never races
  # the schema. The runner takes the database as an ARGUMENT.
  migrate:
    <<: [*node-app, *api-image]
    # The wait is here rather than in a `depends_on` because the database may
    # not be a service in this composition at all (see the header). psql is in
    # this image for the migration runner's own sake.
    command:
      - sh
      - -c
      - |
        tries=90
        until PGCONNECT_TIMEOUT=5 psql "$$DATABASE_URL" -c 'select 1' >/dev/null 2>&1; do
          tries=$$((tries - 1))
          if [ "$$tries" -le 0 ]; then
            echo '[migrate] the database named by DATABASE_URL never answered' >&2
            exit 1
          fi
          sleep 2
        done
        pnpm schema:migrate "$$DATABASE_URL"
        # The deploy check: once per release, re-validate every saved automation
        # and advance the language version pins that are clean under this
        # release (apps/api/src/scripts/deploy_check.ts). HERE because this
        # one-shot runs exactly once per deployment however many api replicas
        # follow, after the schema and before the api takes traffic. It exits 0
        # even when it cannot finish: a pin it did not reach stays put.
        node build/scripts/deploy_check.js
    environment:
      LISTEN_FIRE_DEMO: ${LISTEN_FIRE_DEMO:-0}
      # See the api's own note on these two.
      DATABASE_URL:
      DATABASE_URL_READONLY:
      # The deploy check validates automations against their connected systems
      # exactly as the api does, so it reads what the api reads to reach them.
      LISTEN_FIRE_PRODUCTS: ${LISTEN_FIRE_PRODUCTS:-all}
      LISTEN_FIRE_PRINCIPAL: ${LISTEN_FIRE_PRINCIPAL:-core}
      NODE_ENV: ${LISTEN_FIRE_NODE_ENV:-production}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      MESSAGE_QUEUE_REDIS_HOSTNAME: ${MESSAGE_QUEUE_REDIS_HOSTNAME:-redis}
      MESSAGE_QUEUE_REDIS_PORT: ${MESSAGE_QUEUE_REDIS_PORT:-6379}
      FAKE_CHANNELS_URL: ${FAKE_CHANNELS_URL:-}
      MOCK_OUTPUT_ADAPTERS: ${MOCK_OUTPUT_ADAPTERS:-}
      # The deploy check loads the api's service graph, so the one-shot needs
      # every variable the api derives below; a missing one crashed the check
      # on load and blocked the api from starting (v0.8.0 upgrade, 2026-09-29).
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-${WEB_BASE_URL:-http://localhost:8080}}
      EXPOSED_FILE_PUBLIC_BASE_URL: ${EXPOSED_FILE_PUBLIC_BASE_URL:-${API_BASE_URL:-http://localhost:8081}}
      KNOWLEDGE_MUTATION_DELIVERY: ${KNOWLEDGE_MUTATION_DELIVERY:-local}
      ASKS_SETTLE_DELIVERY: ${ASKS_SETTLE_DELIVERY:-local}
      INBOUND_EMAIL_ADDRESS:
      RESEND_API_BASE_URL:
      AWS_S3_ENDPOINT:
    # Not postgres — that one may not exist. `init` is what mints the database
    # URL a bundled installation uses, so it still has to have finished.
    depends_on:
      init:
        condition: service_completed_successfully
    restart: 'no'

  api:
    <<: [*node-app, *api-image]
    command: ['node', 'build/server.js']
    environment:
      PORT: 3000
      LISTEN_FIRE_PRODUCTS: ${LISTEN_FIRE_PRODUCTS:-all}
      LISTEN_FIRE_PRINCIPAL: ${LISTEN_FIRE_PRINCIPAL:-core}
      # Read by `with-generated-env`, which derives the dev-loop harness ids
      # only when this is 1 — see that script. Every service that sources the
      # generated secrets needs it, because the wrapper also UNSETS the ids an
      # older generator baked into an existing config volume.
      LISTEN_FIRE_DEMO: ${LISTEN_FIRE_DEMO:-0}
      # Demo runs non-production on purpose: outbound email then goes to the
      # fake outbox instead of a Mailgun that isn't configured.
      NODE_ENV: ${LISTEN_FIRE_NODE_ENV:-production}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      # Where an OAuth consent screen returns the person. Those callback pages
      # (`/attio`, `/airtable`, `/dropbox`, `/google-integrations`)
      # are served by the WEB app, so this defaults to the web origin.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-${WEB_BASE_URL:-http://localhost:8080}}
      # The origin a third party fetches an exposed file's bytes from. That
      # route is served by the API, and the code's own fallback is
      # OAUTH_REDIRECT_BASE_URL — the web origin — so pin it to the API here.
      EXPOSED_FILE_PUBLIC_BASE_URL: ${EXPOSED_FILE_PUBLIC_BASE_URL:-${API_BASE_URL:-http://localhost:8081}}
      # The bundled Redis unless you name your own — which also parks the
      # bundled service (see the header). Host and port only: the client is
      # built from these two and nothing else, so a managed Redis that demands
      # AUTH or TLS cannot be reached through them.
      MESSAGE_QUEUE_REDIS_HOSTNAME: ${MESSAGE_QUEUE_REDIS_HOSTNAME:-redis}
      MESSAGE_QUEUE_REDIS_PORT: ${MESSAGE_QUEUE_REDIS_PORT:-6379}
      # Both default to the composed deployment's answer — an in-process
      # consumer — because a bare `docker compose up` is the composed
      # deployment. `up.sh` overrides them for a shape without automations.
      KNOWLEDGE_MUTATION_DELIVERY: ${KNOWLEDGE_MUTATION_DELIVERY:-local}
      ASKS_SETTLE_DELIVERY: ${ASKS_SETTLE_DELIVERY:-local}
      FAKE_CHANNELS_URL: ${FAKE_CHANNELS_URL:-}
      MOCK_OUTPUT_ADAPTERS: ${MOCK_OUTPUT_ADAPTERS:-}
      # Email: the address automations receive mail on, and where the Resend
      # receiving API lives (the demo points it at the stand-in). Passed through
      # only when set — a bare key inherits from the shell and is omitted when
      # unset, so the code never sees an empty string where it expects absence.
      INBOUND_EMAIL_ADDRESS:
      RESEND_API_BASE_URL:
      # The database and the object store, when you have named your own. Bare
      # keys again: set in `.env` they arrive through `env_file` anyway, and set
      # in the SHELL they need this line to cross into the container at all —
      # which is what makes the same switch work from either place.
      DATABASE_URL:
      DATABASE_URL_READONLY:
      AWS_S3_ENDPOINT:
    # Not redis, and not postgres: neither is necessarily a service here. The
    # schema is what the api genuinely cannot start without, and `migrate` has
    # already waited for the database on its behalf.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # LISTEN_FIRE_BIND is WHICH host address the published ports answer on, for
    # all three apps. `127.0.0.1` is what a deployment behind a reverse proxy on
    # the same box wants — the proxy reaches them, and nothing else can, so the
    # firewall stops being the only thing between the internet and a plain-HTTP
    # port. Every interface is the default, because a trial has no proxy.
    ports:
      - '${LISTEN_FIRE_BIND:-0.0.0.0}:${API_PORT:-8081}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/.well-known/health-check || exit 1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *node-app
    image: ghcr.io/listen-fire/web:${LISTEN_FIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: web
    command: ['node', 'apps/web/server.js']
    environment:
      PORT: 3000
      LISTEN_FIRE_DEMO: ${LISTEN_FIRE_DEMO:-0}
      # The SERVER-side proxy target. The browser only ever calls same-origin.
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${LISTEN_FIRE_BIND:-0.0.0.0}:${WEB_PORT:-8080}:3000'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Core only: the admin app is platform-admin surface, and every one of its
  # routers is owned by `residual` or `core`.
  admin:
    <<: *node-app
    profiles: ['admin']
    image: ghcr.io/listen-fire/admin:${LISTEN_FIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: admin
    command: ['node', 'apps/admin/server.js']
    environment:
      PORT: 3000
      LISTEN_FIRE_DEMO: ${LISTEN_FIRE_DEMO:-0}
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${LISTEN_FIRE_BIND:-0.0.0.0}:${ADMIN_PORT:-8082}:3000'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # The demo's stand-in third parties: Attio, Slack, Airtable, an email outbox.
  fake-channels:
    profiles: ['demo']
    image: ghcr.io/listen-fire/fake-channels:${LISTEN_FIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: fake-channels
    # Loopback only, deliberately: the outbox holds live magic links, and a
    # single-use login link readable by anything on the LAN is a signed-in
    # session for whoever fetches it first.
    ports:
      - '127.0.0.1:${FAKE_CHANNELS_PORT_HOST:-8083}:5556'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://127.0.0.1:5556/email/outbox').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The demo dataset: the team and its `vc-dealflow` ontology, a graph of
  # sample organisations, one working automation, one valuation case. Runs after
  # the API is healthy because the sample data goes through the real surfaces.
  #
  # Every piece is idempotent AND gated on its unit being mounted — seeding a
  # valuation case on a knowledge-only stack is a skip, not a failure, so this
  # one service is correct for every shape `up.sh` can start.
  seed:
    <<: [*node-app, *api-image]
    profiles: ['demo']
    working_dir: /srv/listen-fire/apps/api
    command:
      - sh
      - -c
      - |
        set -e
        mounts() {
          case ",$${LISTEN_FIRE_PRODUCTS:-all}," in
            *,all,*|*,"$$1",*) return 0 ;;
            *) return 1 ;;
          esac
        }
        pnpm dev:seed --pretty
        if mounts knowledge; then pnpm dev:demo-graph; fi
        if mounts automations; then pnpm dev:movement provision; fi
        if mounts valuations; then
          pnpm dev:valuations setup
          pnpm dev:valuations seed
        fi
    environment:
      NODE_ENV: development
      # Not ${LISTEN_FIRE_DEMO}: this service exists only in the `demo` profile, so it
      # IS the demo. Hardcoding it keeps the seed from losing the harness ids it
      # needs when somebody runs compose by hand without the variable set.
      LISTEN_FIRE_DEMO: '1'
      # The seed asks the same question the API does — which units are here —
      # so the two must be given the same answer, principal included (they are
      # checked against each other at boot).
      LISTEN_FIRE_PRODUCTS: ${LISTEN_FIRE_PRODUCTS:-all}
      LISTEN_FIRE_PRINCIPAL: ${LISTEN_FIRE_PRINCIPAL:-core}
      API_BASE_URL: http://api:3000
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      FAKE_CHANNELS_URL: http://fake-channels:5556
      MOCK_OUTPUT_ADAPTERS: 'true'
      # The seed provisions a movement that imports `email`; without the
      # address that import is a configuration gap and the seed refuses.
      INBOUND_EMAIL_ADDRESS:
      RESEND_API_BASE_URL: http://fake-channels:5556/resend
      # See the api's own note on these two.
      DATABASE_URL:
      DATABASE_URL_READONLY:
    depends_on:
      api:
        condition: service_healthy
      fake-channels:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata:
  redisdata:
  # The bundled object store's bucket. `down -v` destroys it, and every file an
  # automation ever wrote with it.
  miniodata:
  listen-fire-config:
