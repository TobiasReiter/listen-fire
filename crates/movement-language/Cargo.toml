[package]
name = "listen-fire-language"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The listen-fire movement language service: completion, hover, definitions, diagnostics and fixes answered from the checker's own results"
readme = "README.md"
keywords = ["movement", "automation", "dsl", "lsp", "listen-fire"]
categories = ["development-tools", "compilers"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
name = "movement_language"

[dependencies]
movement-parser = { package = "listen-fire-parser", version = "0.11.0-rc.1", path = "../movement-parser" }
movement-checker = { package = "listen-fire-checker", version = "0.11.0-rc.1", path = "../movement-checker" }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }
