[package]
name = "listen-fire-checker"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The listen-fire movement language checker: diagnostics, types and import links for a parsed movement"
readme = "README.md"
keywords = ["movement", "automation", "dsl", "workflow", "listen-fire"]
categories = ["compilers", "development-tools"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
name = "movement_checker"
crate-type = ["rlib"]

[dependencies]
# The AST, the expression lowering and the catalog snapshot it reads.
movement-parser = { package = "listen-fire-parser", version = "0.11.0", path = "../movement-parser" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
# As the parser's: `preserve_order` off, so every emitted object's keys sort.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }

[features]
# A native zone database (src/host.rs, `native::NativeZones`) for this
# crate's tests and the parity harness. Inert on wasm32, where the host
# answers zones and no zone data is linked.
default = ["native-zones"]
native-zones = ["dep:jiff", "dep:jiff-tzdb"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The engine's pins (its native-env): one zone database for both crates.
jiff = { version = "=0.2.16", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }
jiff-tzdb = { version = "=0.1.4", optional = true }
