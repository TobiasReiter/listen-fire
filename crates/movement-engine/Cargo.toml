[package]
name = "listen-fire-engine"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The listen-fire movement engine: runs a checked movement against a host you supply, natively or over WASM"
readme = "README.md"
keywords = ["movement", "automation", "dsl", "workflow", "listen-fire"]
categories = ["compilers", "development-tools"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
name = "movement_engine"
# cdylib is the WASM artifact; rlib lets `cargo test` link the crate natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Parsing, lowering and the catalog. Its ABI (alloc, dealloc, last_panic and
# the parse exports) is linked into this crate's artifact as-is, which is
# what makes the one artifact serve both the parser and the engine.
movement-parser = { package = "listen-fire-parser", version = "0.12.0-rc.2", path = "../movement-parser" }
# The checker, an alternative answer to `check.program` behind
# `SegmentInput::native_check` (off by default). Its ABI export
# (`check_program`) is linked into this crate's artifact as the parser's is.
movement-checker = { package = "listen-fire-checker", version = "0.12.0-rc.2", path = "../movement-checker" }
serde = { version = "1", features = ["derive"] }
# As the parser's: `preserve_order` off, so every emitted object's keys sort.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }

[features]
# The environment services natively (src/env_services.rs): a zone database,
# WHATWG URL parsing and ICU4X's Unicode data. On by default so `cargo test`
# runs the standard library; inert on wasm32, where the loader's JavaScript
# answers instead and these crates are not linked at all.
default = ["native-env"]
native-env = ["dep:jiff", "dep:jiff-tzdb", "dep:url", "dep:icu_normalizer"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The zone database bundled rather than read from the system, so every
# machine answers alike. Held at 0.2.16, the last release that accepts the
# jiff-tzdb pin below.
jiff = { version = "=0.2.16", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }
# Pinned to the zone data Node's ICU carries (process.versions.tz, 2025b
# on Node 22.20), so both implementations read one database:
# tests/env_services.rs checks the pairing against tests/env/versions.json.
jiff-tzdb = { version = "=0.1.4", optional = true }
url = { version = "2.5.8", optional = true }
icu_normalizer = { version = "2.3.0", optional = true }
