[package]
name = "movement-parser"
version = "0.1.0"
edition = "2024"
publish = false
description = "The movement-language parser, exposed to TypeScript through a C ABI over WASM"

[lib]
# cdylib is the WASM artifact; rlib lets `cargo test` link the crate natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` stays off: serde_json's Map is then a BTreeMap, which is
# what makes `to_sorted_json` emit sorted keys.
serde_json = "1"
