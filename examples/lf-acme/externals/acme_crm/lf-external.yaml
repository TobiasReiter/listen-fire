# An installed external: what it is and how the host reaches it.
name: acme_crm
kind: adapter            # adapter (a system to connect) | plugin (a package of plugins to import)
protocol: 2
# Started by the host with PORT=0 in its environment; it prints "listening <port>".
command: [node, server.mjs]
# url: http://127.0.0.1:5557/   # instead of command: reach an adapter already running
# module: ../../node_modules/@listen-fire/dealroom   # instead of command: a module, served by serve-module
auth: { kind: bearer, field: token }   # which secret field the host sends on each call
webhook:
  # How the host verifies a delivery at /hooks/acme_crm/<install>: HMAC-SHA256
  # of the raw body, hex, in this header, keyed by this secret field.
  signature: hmac-sha256
  header: x-listen-fire-signature
  secretField: webhook_secret
env:
  ACME_CRM_STATE: "{lf}/externals/acme_crm/state.json"
