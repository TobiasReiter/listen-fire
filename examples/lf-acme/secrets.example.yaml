# Copy to .lf/secrets.yaml. Credential name -> the external it is for + its fields.
# SOPS-compatible: encrypt in place with `sops -e -i .lf/secrets.yaml`.
acme:
  external: acme_crm
  token: dev-acme-token
  webhook_secret: dev-acme-webhook-secret

# Containers and CI: no file needed. The environment overrides the file field by
# field, and can create a credential the file does not name:
#   LF_SECRET__ACME__EXTERNAL=acme_crm
#   LF_SECRET__ACME__TOKEN=...
#   LF_SECRET__ACME__WEBHOOK_SECRET=...
# (double underscores between LF_SECRET, the credential and the field; names are
# matched lowercased). LF_SECRETS_FILE=/run/secrets/lf.yaml points at a mounted file.
#
# OAuth: a credential with `refresh_token` and `token_url` (optionally `client_id`,
# `client_secret`, `expires_at` as an ISO time) is refreshed before a call when
# `expires_at` is within 30 s, and when a call answers `unauthorized`. The new
# `access_token`, `expires_at` and any rotated `refresh_token` are written back to
# this file (with `sops set` when it is encrypted); fields from the environment
# are used for the run only.
