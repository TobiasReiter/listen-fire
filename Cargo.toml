[workspace]
resolver = "3"
members = ["crates/lf", "crates/movement-checker", "crates/movement-engine", "crates/movement-language", "crates/movement-parser", "examples/rust-embed"]

# One release version for the toolchain: the three library crates and the
# `listen-fire` facade (crates/lf, which installs `lf`) publish together.
[workspace.package]
version = "0.12.0-rc.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/listen-fire/listen-fire"
homepage = "https://github.com/listen-fire/listen-fire"
rust-version = "1.85"

# The committed WASM artifact is built with this profile; the CI check
# rebuilds it and compares bytes, so changing it means rebuilding and
# committing the artifact in the same change.
[profile.release]
# "z" over "s": 9% smaller (442,538 vs 486,896 bytes; gzipped 144,698 vs
# 154,904), parity and the shadow-stack band at the depth limit unchanged
# (measured 2026-10-06). The browser downloads and compiles every byte.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
